name: PR Checks

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    # Cheap change-gate: detect which SDK dirs a PR touches so the heavier
    # per-language lanes only boot when their language actually changed. This
    # mirrors the cost-conscious gating used elsewhere in the org — unchanged
    # languages don't burn a runner.
    changes:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            ts: ${{ steps.filter.outputs.ts }}
            rust: ${{ steps.filter.outputs.rust }}
            go: ${{ steps.filter.outputs.go }}
            python: ${{ steps.filter.outputs.python }}
            dotnet: ${{ steps.filter.outputs.dotnet }}
            desktop: ${{ steps.filter.outputs.desktop }}
        steps:
            - uses: actions/checkout@v4

            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      ts:
                          - 'parity/**'
                          - 'packages/**'
                          - 'package.json'
                          - 'pnpm-lock.yaml'
                          - 'pnpm-workspace.yaml'
                          - 'turbo.json'
                          - 'tsconfig.base.json'
                          - '.changeset/**'
                          - '.github/workflows/pr-checks.yml'
                      rust:
                          - 'parity/**'
                          - 'rust/**'
                          - '.github/workflows/pr-checks.yml'
                      go:
                          - 'parity/**'
                          - 'go/**'
                          - '.github/workflows/pr-checks.yml'
                      python:
                          - 'parity/**'
                          - 'python/**'
                          - '.github/workflows/pr-checks.yml'
                      dotnet:
                          - 'parity/**'
                          - 'dotnet/**'
                          - '.github/workflows/pr-checks.yml'
                      # `desktop/` is its own cargo workspace, NOT a member of
                      # `rust/`, so the rust lane never compiled it. It has no
                      # `parity/**` trigger because the studio is a client of
                      # the ingest API, not an SDK bound by the corpus.
                      desktop:
                          - 'desktop/**'
                          - '.github/workflows/pr-checks.yml'

    # Version-drift gate — deliberately NOT gated on `changes`.
    #
    # Five SDKs ship one version number, sourced from packages/core/package.json
    # (the org's convention: @smooai/fetch is 3.4.1 on npm, crates.io AND PyPI).
    # This asserts every version-bearing file agrees, and FAILS on mismatch
    # rather than warning.
    #
    # It runs on every PR because drift is introduced by editing any one of
    # fourteen files across five languages, and a path filter would let exactly
    # the interesting case through: a PR that touches only Go, in a repo where
    # the version came from a TypeScript manifest.
    versions:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            # No dependencies needed — the script is stdlib-only on purpose, so
            # this lane stays a few seconds and cannot be broken by an install.
            - name: Check version sync
              run: node scripts/sync-versions.mjs --check

    # TypeScript lane — unchanged behaviour, now gated on TS-relevant changes.
    validate:
        needs: changes
        if: needs.changes.outputs.ts == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Format check
              run: pnpm format:check

    # Rust lane — fmt, clippy (warnings as errors), tests. Manifest in rust/.
    rust:
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: rust
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust -> target

            - name: Format check
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Test
              run: cargo test --all-features

    # Go lane — gofmt, vet, tests. Module in go/.
    go:
        needs: changes
        if: needs.changes.outputs.go == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: go
        steps:
            - uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.25'
                  cache-dependency-path: go/go.mod

            - name: Format check
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "The following files are not gofmt-clean:"
                      echo "$unformatted"
                      exit 1
                  fi

            # The Fiber/Gin adapters are separate Go modules (own go.mod) so the
            # core stays dependency-free; vet/test must run per-module.
            - name: Vet
              run: |
                  for m in . fiber gin; do
                      [ -f "$m/go.mod" ] || continue
                      echo "::group::go vet ($m)"; (cd "$m" && go vet ./...); echo "::endgroup::"
                  done

            - name: Test
              run: |
                  for m in . fiber gin; do
                      [ -f "$m/go.mod" ] || continue
                      echo "::group::go test ($m)"; (cd "$m" && go test ./...); echo "::endgroup::"
                  done

            # Catch an unpublishable module at review time rather than at
            # release. A `replace` directive or a mismatched module path builds
            # fine in here and resolves nothing for anyone outside — which is
            # how both adapters shipped requiring a core version that has never
            # existed. Same script publish.yml runs.
            - name: Verify the modules are publishable
              run: bash ../scripts/check-go-modules.sh

    # Python lane — ruff lint + format, pytest. Package in python/.
    python:
        needs: changes
        if: needs.changes.outputs.python == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: python
        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Set up Python
              run: uv python install 3.13

            - name: Sync dependencies
              run: uv sync --all-extras --dev --python 3.13

            # ruff/pytest aren't declared deps yet, so run them via uvx /
            # `uv run --with` rather than assuming they're in the project env.
            # Once they're added to a dev group these collapse to `uv run`.
            - name: Ruff lint
              run: uvx ruff@0.16.2 check .

            - name: Ruff format check
              run: uvx ruff@0.16.2 format --check .

            - name: Test
              run: uv run --with pytest pytest

    # .NET lane — build, test, format verify. Solution in dotnet/.
    dotnet:
        needs: changes
        if: needs.changes.outputs.dotnet == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: dotnet
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: dotnet/global.json

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release

            - name: Test
              run: dotnet test --no-build --configuration Release

            - name: Format verify
              run: dotnet format --verify-no-changes

    # Desktop lane — fmt, clippy (warnings as errors), tests. Separate cargo
    # workspace in desktop/.
    #
    # Until this existed, the flagship 4.4k-LOC Dioxus studio was NEVER compiled
    # on a PR: `build-desktop.yml` only fires on a `studio-v*` tag, a manual
    # dispatch, or a push to main, so a broken desktop change landed on main and
    # was discovered at release time. This lane compiles it before the merge, not
    # after.
    #
    # `cargo check` rather than a full bundle: the three-OS bundling in
    # `build-desktop.yml` is the release artifact and takes ~20 min a platform.
    # What a PR needs to know is "does it compile, lint and test", which is one
    # Linux runner.
    desktop:
        needs: changes
        if: needs.changes.outputs.desktop == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: desktop
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: desktop -> target

            # Dioxus desktop uses wry / WebKitGTK on Linux. Same package set as
            # build-desktop.yml's Linux leg — keep the two in sync, or this lane
            # goes green on a build the release workflow cannot reproduce.
            - name: Install Linux deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libsoup-3.0-dev \
                      libjavascriptcoregtk-4.1-dev \
                      libxdo-dev \
                      libayatana-appindicator3-dev

            - name: Format check
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test
              run: cargo test --workspace
