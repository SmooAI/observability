name: Release (Changesets 🦋)

on:
    workflow_dispatch:
    push:
        branches:
            - main

concurrency:
    group: release
    cancel-in-progress: false

env:
    CI: true
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    version:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
            actions: write
        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GH_PAT }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Locate pnpm store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-store-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Format check
              run: pnpm format:check

            - name: Version Update 🦋
              id: changesets
              uses: changesets/action@v1
              with:
                  commit: '🦋 New version release'
                  title: '🦋 New version release'
                  # WITHOUT this input the action runs `changeset version`
                  # itself and the package.json `version` SCRIPT never fires —
                  # npm lifecycle hooks respond to `npm version`, not to
                  # `changeset version`. That is exactly how #100/#101 bumped
                  # packages/core to 0.19.2 while the other thirteen
                  # version-bearing files stayed at 0.19.0 and turned the
                  # `versions` lane red on main.
                  #
                  # `pnpm run version` (not `pnpm version`, which is pnpm's own
                  # builtin) runs `changeset version && node
                  # scripts/sync-versions.mjs`. The action commits the working
                  # tree after this command, so the synced files land in the
                  # release commit — the whole point of syncing here rather than
                  # after publish.
                  version: pnpm run version
                  publish: pnpm ci:publish
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                  NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

            - name: Auto-Merge Changeset PR
              run: |
                  PR_NUMBER=$(gh pr list --state open --head changeset-release/main --json number --jq '.[0].number')

                  if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
                    echo "Found Changeset PR #$PR_NUMBER, attempting to auto-merge..."
                    gh pr merge "$PR_NUMBER" --auto --squash
                  else
                    echo "No open Changeset PR found, skipping merge."
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}
