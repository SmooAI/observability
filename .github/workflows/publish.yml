name: Publish SDKs

# Publish the per-language SDKs to their registries.
#
# This workflow is DORMANT by default: each job only runs when its own language
# is selected, either by pushing a language-prefixed SemVer tag or by a manual
# workflow_dispatch with the matching `language` input. Pushing to a branch does
# NOT publish anything — only tags / dispatch trigger a publish.
#
# The TypeScript SDK is published separately via release.yml (changesets → npm);
# this workflow deliberately does NOT touch the TS flow.
#
# ─────────────────────────────────────────────────────────────────────────────
# SECRETS — these are ORG-level and already exist. Nothing to create.
#
#   SMOOAI_CARGO_REGISTRY_TOKEN   crates.io API token   (Rust publish)
#   SMOOAI_PYPI_TOKEN             PyPI API token        (Python publish)
#   SMOOAI_NUGET_API_KEY          nuget.org API key     (.NET publish)
#
# These names are not cosmetic. This workflow previously read
# `secrets.CARGO_REGISTRY_TOKEN`, `secrets.NUGET_API_KEY` and
# `secrets.PYPI_API_TOKEN` — none of which exist for this repo, at either the
# org or the repo level. A missing secret is the empty string in an expression,
# so every publish job would have run its full test suite, packaged cleanly, and
# then failed at the upload with an auth error, or worse pushed an unauthorized
# request. The names above are the ones `gh api .../actions/organization-secrets`
# actually reports, and match what SmooAI/logger uses to publish today.
#
# Go needs NO secret: pkg.go.dev pulls modules from the Go module proxy
# automatically once a SemVer git tag exists.
# ─────────────────────────────────────────────────────────────────────────────
#
# TAGGING CONVENTION (push a tag to publish that language):
#   rust-v<semver>        e.g. rust-v0.19.0       → crates.io
#   python-v<semver>      e.g. python-v0.19.0     → PyPI
#   dotnet-v<semver>      e.g. dotnet-v0.19.0     → NuGet
#   go/v<semver>          e.g. go/v0.19.0         → pkg.go.dev (module proxy)
#   go/fiber/v<semver>    e.g. go/fiber/v0.19.0   → pkg.go.dev (Fiber adapter)
#   go/gin/v<semver>      e.g. go/gin/v0.19.0     → pkg.go.dev (Gin adapter)
#
# The Go tag prefixes are directory paths (not `go-v`) because Go's module proxy
# requires a submodule's tag to be `<subdir>/v<semver>`. `go/fiber` and `go/gin`
# are separate modules with their own go.mod, so they get their own tags.
#
# ⚠️ ORDER MATTERS for Go: push `go/v<semver>` FIRST and let the proxy pick it
# up, then `go/fiber/v<semver>` and `go/gin/v<semver>`. The adapters' go.mod
# files `require` the core module at that exact version — they cannot resolve
# until it exists.
#
# Every tag must match the version in `packages/core/package.json`, which is the
# single source of truth for all five SDKs (see scripts/sync-versions.mjs). The
# `verify` job below enforces that and every publish job depends on it, so a
# mistyped tag fails before anything is uploaded — which matters because
# crates.io, PyPI and NuGet publishes are IRREVERSIBLE.

on:
    workflow_dispatch:
        inputs:
            language:
                description: 'Which SDK to publish'
                required: true
                type: choice
                options:
                    - rust
                    - python
                    - dotnet
                    - go
            dry_run:
                description: 'Build + verify only, do not actually publish'
                required: false
                type: boolean
                default: false
    push:
        tags:
            - 'rust-v*'
            - 'python-v*'
            - 'dotnet-v*'
            - 'go/v*'
            - 'go/fiber/v*'
            - 'go/gin/v*'

# Never run two publishes for the same ref at once.
concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # ── Gate: the tag must mean what it says ─────────────────────────────────
    #
    # Every publish job depends on this. crates.io, PyPI and NuGet publishes are
    # IRREVERSIBLE — a version pushed under a mistyped tag can be yanked but
    # never replaced — so the cheap check runs first, on its own runner, before
    # any language toolchain boots.
    #
    # Two assertions:
    #   1. all 14 version-bearing files across the five SDKs agree with
    #      packages/core/package.json (the same check pr-checks.yml runs)
    #   2. the tag's version IS that version
    #
    # Together they mean: whatever this tag publishes reports the version the
    # tag claims. That is precisely what was NOT true before — every SDK
    # hard-coded 0.1.0 while npm shipped 0.19.0.
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.expected.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Check version sync across all five SDKs
              run: node scripts/sync-versions.mjs --check

            - name: Read the expected version
              id: expected
              run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Verify the tag matches
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  # Strip whichever language prefix this tag carries. Anchored and
                  # explicit rather than a greedy strip, so an unrecognised tag
                  # shape fails loudly instead of silently yielding the whole tag.
                  VERSION="$(printf '%s' "$TAG" | sed -E 's#^(rust-v|python-v|dotnet-v|go/(fiber/|gin/)?v)##')"
                  EXPECTED="${{ steps.expected.outputs.version }}"
                  echo "tag=$TAG  tag-version=$VERSION  package.json=$EXPECTED"
                  if [ "$VERSION" = "$TAG" ]; then
                      echo "::error::tag '$TAG' does not match any known prefix (rust-v, python-v, dotnet-v, go/v, go/fiber/v, go/gin/v)"
                      exit 1
                  fi
                  if [ "$VERSION" != "$EXPECTED" ]; then
                      echo "::error::tag '$TAG' says version $VERSION but packages/core/package.json says $EXPECTED — nothing published"
                      exit 1
                  fi

    # ── Rust → crates.io ─────────────────────────────────────────────────────
    rust:
        needs: verify
        if: >-
            startsWith(github.ref, 'refs/tags/rust-v') ||
            (github.event_name == 'workflow_dispatch' && inputs.language == 'rust')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: rust
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust -> target

            # Fail on a missing credential BEFORE the suite runs, not after a
            # clean package at the upload step. A missing secret is the empty
            # string in a GitHub expression — silent until it isn't.
            - name: Require the crates.io credential
              if: ${{ !inputs.dry_run }}
              env:
                  TOKEN: ${{ secrets.SMOOAI_CARGO_REGISTRY_TOKEN }}
              run: |
                  if [ -z "$TOKEN" ]; then
                      echo "::error::crates.io credential is empty — the secret is missing or not visible to this repo. Nothing published."
                      exit 1
                  fi
                  echo "crates.io credential present."

            # Gate publish on the same checks the PR lane runs, so a broken SDK
            # can't ship.
            - name: Format check
              run: cargo fmt --all --check

            - name: Clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Test
              run: cargo test --all-features

            # Verifies the crate packages cleanly (metadata, included files,
            # builds from the packaged tarball) without uploading.
            # --locked, not --allow-dirty. A publish that needs to mutate the
            # lockfile is publishing something the tag never built; the sibling
            # repos reach for --allow-dirty precisely because their version sync
            # runs after publish and leaves the tree dirty. Ours runs in the
            # `version` lifecycle, so the tree is clean and the lock is current.
            - name: Package (verify)
              run: cargo package --locked -p smooai-observability

            - name: Publish to crates.io
              if: ${{ !inputs.dry_run }}
              run: cargo publish --locked -p smooai-observability
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.SMOOAI_CARGO_REGISTRY_TOKEN }}

    # ── Python → PyPI ────────────────────────────────────────────────────────
    python:
        needs: verify
        if: >-
            startsWith(github.ref, 'refs/tags/python-v') ||
            (github.event_name == 'workflow_dispatch' && inputs.language == 'python')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Token auth, not OIDC Trusted Publishing. The OIDC path this job used
        # to declare needed three things that are not true here: a `pypi`
        # environment (this repo has ZERO environments configured), a Trusted
        # Publisher registered on PyPI for repo+workflow+environment, and — for
        # a package that does not exist yet — a PENDING publisher created by
        # hand first. `SMOOAI_PYPI_TOKEN` already exists at the org level and is
        # how SmooAI/logger publishes smooai-logger today.
        defaults:
            run:
                working-directory: python
        steps:
            - uses: actions/checkout@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            # Fail on a missing credential BEFORE the suite runs, not after a
            # clean package at the upload step. A missing secret is the empty
            # string in a GitHub expression — silent until it isn't.
            - name: Require the PyPI credential
              if: ${{ !inputs.dry_run }}
              env:
                  TOKEN: ${{ secrets.SMOOAI_PYPI_TOKEN }}
              run: |
                  if [ -z "$TOKEN" ]; then
                      echo "::error::PyPI credential is empty — the secret is missing or not visible to this repo. Nothing published."
                      exit 1
                  fi
                  echo "PyPI credential present."

            - name: Set up Python
              run: uv python install 3.13

            - name: Sync dependencies
              run: uv sync --all-extras --dev --python 3.13

            # Gate publish on the PR-lane checks.
            - name: Ruff lint
              run: uvx ruff@0.16.2 check .

            - name: Ruff format check
              run: uvx ruff@0.16.2 format --check .

            - name: Test
              run: uv run --with pytest pytest

            - name: Build sdist + wheel
              run: uv build --wheel --sdist

            - name: Publish to PyPI
              if: ${{ !inputs.dry_run }}
              run: uv publish
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.SMOOAI_PYPI_TOKEN }}

    # ── .NET → NuGet ─────────────────────────────────────────────────────────
    dotnet:
        needs: verify
        if: >-
            startsWith(github.ref, 'refs/tags/dotnet-v') ||
            (github.event_name == 'workflow_dispatch' && inputs.language == 'dotnet')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: dotnet
        steps:
            - uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  global-json-file: dotnet/global.json

            # Fail on a missing credential BEFORE the suite runs, not after a
            # clean package at the upload step. A missing secret is the empty
            # string in a GitHub expression — silent until it isn't.
            - name: Require the NuGet credential
              if: ${{ !inputs.dry_run }}
              env:
                  TOKEN: ${{ secrets.NUGET_API_KEY || secrets.SMOOAI_NUGET_API_KEY }}
              run: |
                  if [ -z "$TOKEN" ]; then
                      echo "::error::NuGet credential is empty — the secret is missing or not visible to this repo. Nothing published."
                      exit 1
                  fi
                  echo "NuGet credential present."

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore --configuration Release

            # Gate publish on tests.
            - name: Test
              run: dotnet test --no-build --configuration Release

            # Packs the library project only (tests are IsPackable=false).
            # Emits the .nupkg + .snupkg symbol package to ./nupkg.
            - name: Pack
              run: dotnet pack src/SmooAI.Observability/SmooAI.Observability.csproj --no-build --configuration Release --output nupkg

            - name: Publish to NuGet
              if: ${{ !inputs.dry_run }}
              run: |
                  dotnet nuget push "nupkg/*.nupkg" \
                    --api-key "$NUGET_API_KEY" \
                    --source https://api.nuget.org/v3/index.json \
                    --skip-duplicate
              env:
                  # Repo-level NUGET_API_KEY first (that is where the sibling repos
                  # keep theirs) with the org secret as the fallback, so this works
                  # whichever one is present.
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY || secrets.SMOOAI_NUGET_API_KEY }}

    # ── Go → pkg.go.dev (no publish step) ────────────────────────────────────
    #
    # Go modules are "published" implicitly: once a SemVer tag exists on the
    # repo, the Go module proxy (proxy.golang.org) fetches and caches it, and
    # pkg.go.dev indexes the docs. There is no registry to push to and no secret
    # required. This job validates the modules are sound and warms the proxy so
    # the new version is immediately resolvable.
    #
    # THREE modules live under go/: the core, plus the `fiber` and `gin`
    # adapters, each with its own go.mod and therefore its own tag. The adapters
    # depend on the core by its published path and version — no `replace`, which
    # a consumer would ignore anyway — so `go/v<semver>` must be tagged and on
    # the proxy BEFORE the adapter tags.
    go:
        needs: verify
        if: >-
            startsWith(github.ref, 'refs/tags/go/') ||
            (github.event_name == 'workflow_dispatch' && inputs.language == 'go')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: go
        steps:
            - uses: actions/checkout@v4

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            # Gate on the PR-lane checks before warming the proxy. gofmt is
            # recursive, so one run covers all three modules; vet and test are
            # per-module because each has its own go.mod.
            - name: Format check
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "The following files are not gofmt-clean:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet + test every module
              run: |
                  # -count=1 disables the test cache. NOT optional here: the
                  # parity corpora live in parity/, OUTSIDE these packages,
                  # and Go's cache does not invalidate on a file it did not
                  # see as a package input. Verified — corrupting a corpus
                  # vector and re-running plain `go test ./...` reports
                  # "ok (cached)" and stays green.
                  for m in . fiber gin; do
                      echo "::group::go vet + test ($m)"
                      (cd "$m" && go vet ./... && go test -count=1 ./...)
                      echo "::endgroup::"
                  done

            # The two things that make a Go module unresolvable for anyone
            # outside this repo — a `replace` directive (consumers ignore it) and
            # a module path that does not match its directory — plus the /vN
            # suffix rule for majors >= 2. Same script the PR lane runs, so the
            # two cannot drift.
            - name: Verify the modules are publishable
              run: bash ../scripts/check-go-modules.sh

            # Ask the module proxy to fetch the just-pushed tag so pkg.go.dev
            # indexes it right away instead of on first external `go get`. Only
            # meaningful on a tag push; skipped on dispatch/dry-run.
            #
            # The module path is derived from the tag, so one step serves all
            # three: `go/v0.19.0` -> …/go, `go/fiber/v0.19.0` -> …/go/fiber.
            - name: Warm module proxy
              if: ${{ startsWith(github.ref, 'refs/tags/go/') && !inputs.dry_run }}
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"           # e.g. go/fiber/v0.19.0
                  VERSION="${TAG##*/}"                     # e.g. v0.19.0
                  SUBDIR="${TAG%/*}"                       # e.g. go/fiber
                  MODULE="github.com/SmooAI/observability/${SUBDIR}"
                  echo "Requesting ${MODULE}@${VERSION} from the proxy"
                  # The proxy escapes uppercase as !<lowercase>, so SmooAI is
                  # !smoo!a!i. Hand-writing that is why this is a literal.
                  ESCAPED="github.com/!smoo!a!i/observability/${SUBDIR}"
                  for attempt in 1 2 3 4 5; do
                      if curl -fsSL "https://proxy.golang.org/${ESCAPED}/@v/${VERSION}.info"; then
                          echo "proxy registered ${MODULE}@${VERSION}"
                          exit 0
                      fi
                      echo "proxy has not caught up yet (attempt $attempt); retrying in 15s"
                      sleep 15
                  done
                  # Non-fatal: the tag exists either way and the proxy fetches on
                  # first external `go get`. Failing the job here would report a
                  # successful release as broken.
                  echo "::warning::proxy did not serve ${MODULE}@${VERSION} within ~75s; it should catch up shortly"
